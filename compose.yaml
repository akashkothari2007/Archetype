services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      PLANCHECK_DATA_DIR: /data/projects
      PYTHONUNBUFFERED: "1"
      PLANCHECK_LOG_LEVEL: ${PLANCHECK_LOG_LEVEL:-INFO}
    command: ["python", "-m", "uvicorn", "plancheck.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "info", "--reload", "--reload-dir", "/app/plancheck"]
    volumes:
      - ./local-data:/data
      - ./plancheck:/app/plancheck
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/desktop/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
