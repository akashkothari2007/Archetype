services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      PLANCHECK_DATA_DIR: /data/projects
    volumes:
      - ./local-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/desktop/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
