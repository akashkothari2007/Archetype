[project]
name = "plancheck"
version = "0.1.0"
description = "Local building design, editable geometry, and verifiable standards review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "shapely>=2.0,<3",
    "ezdxf>=1.4,<2",
    "ifcopenshell>=0.8.5,<0.9",
    "filelock>=3.16,<4",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-timeout>=2.3",
]

[project.scripts]
plancheck-demo = "plancheck.demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plancheck*"]

[tool.setuptools.package-data]
plancheck = [
    "fixtures/*.json",
    "web/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
